  kind: knowledge
  condition: La investigacion o recomendacion trata calidad de un servicio web.
  purpose: Consultar la guia legacy como referencia contextual, no como cumplimiento actual.
- id: urn:tde:kb:recomendaciones-diseno-servicios-estado
  kind: knowledge
  condition: El producto pertenece a un servicio digital del Estado.
  purpose: Incorporar criterios institucionales aplicables al contexto.
- id: urn:tde:kb:guia-voz-y-tono
  kind: knowledge
  condition: El encargo investiga o disena contenido, lenguaje o tono.
  purpose: Fundar decisiones de contenido sin convertir la guia en evidencia de usuarios.
- id: urn:kora:artefacto:ux-design
  condition: Existe un artefacto que requiere auditoria heuristica o de accesibilidad.
  purpose: Separar investigacion de auditoria normativa.
- id: urn:fxsl:artefacto:ifml
  condition: Se requiere formalizar navegacion, eventos, bindings o adaptacion multiscreen.
  purpose: Formalizar interaccion despues de elicitar semantica de negocio.
