  legacy_header: '---

    urn: urn:dev:artefacto:steipete

    nombre: steipete

    version: 1.7.0

    estado: activo

    descripcion: "Director de ejecucion cognitiva. Persona sintetica inspirada en
    Peter Steinberger: ingeniero de producto aumentado por enjambres de agentes que
    opera con just-talk-to-it, ship-beats-perfect, blast-radius controlado, loop-closure
    obligatorio, architecture-over-implementation y context-hygiene. Para ciclos de
    desarrollo donde el humano dirige taste/arquitectura y el sistema produce software
    a velocidad de inferencia."

    fuente: "Sublimado el 2026-06-12 desde la bestia artifacts/agents/dev/steipete/AGENT.md
    v1.0.1 (sha256:4abe0be4d451626403824b2f1d94fb39052b0106a3c3ab0dbd34be724aac9cda);
    cuerpo Markdown preservado byte-fiel. La forma agente-propiamente-tal de la bestia
    es la forma agente de pneuma (renombre de ley/1). urn:kora:kb:gobernanza no migra
    (la constitucion pneuma es la ley); su rol lo ocupa urn:kora:kb:alma-de-kora.
    La config runtime del payload queda en la bestia como procedencia. Correccion
    1.0.2 (2026-06-15): las referencias de ''Cuando NO Usar'' y de la tabla de composicion
    apuntaban a urn:kora:kb:meta-kora-rebuild-directive (registro no migrable de la
    bestia) y a david-allen en staging de la bestia, en idiom de bestia (IR, staging);
    se reapuntaron a urn:kora:kb:regimen-de-ley y se tradujeron al regimen de doctrina
    de pneuma (H1/H2, auditoria 2026-06-15). El cuerpo deja de ser byte-fiel a la
    bestia en esos puntos. v1.1.0 (2026-07-01): se realiza el target openclaw (ley/3
    v1.3.0, T-openclaw-pneuma-v1); se anade a ''targets'' y se delimita el span de
    U_phen (la seccion Style = la voz) con el centinela kora:soul (ley/2 v1.4.0 §10
    r6) para que el funtor emita SOUL.md segregado de AGENTS.md. El cuerpo sigue byte-fiel
    salvo los dos centinelas (comentarios HTML invisibles). Correccion 1.1.1 (2026-07-06):
    ''Cuando NO Usar'' afirmaba que la capacidad GTD no encarna en pneuma — falso
    desde 2026-07-01 (urn:fxsl:artefacto:david-allen activo); se repunta la derivacion
    (correccion de verdad, hallazgo del diff anti-despotenciacion, deploy Fase A).
    v1.2.0 (2026-08-01): incorpora a urn:dev:artefacto:fugaz como ejecutor delegado
    Codex, define el task packet y el recibo tipados, mantiene arquitectura e integracion
    en Steipete y declara que la arista componible no prueba wiring ni autoridad runtime.
    Correccion 1.2.1 (2026-08-01): fija el aislamiento requerido al seleccionar un
    custom agent Codex para evitar el rechazo mecanico de agent_type con herencia
    completa del historial. Correccion 1.2.2 (2026-08-02): explicita que cada delegacion
    Fugaz abre una sesion o agent thread nuevo, aislado y efimero, gobernado desde
    la sesion central de Steipete; conserva topologia de un nivel y hace agnostico
    de modelos el contrato. v1.3.0 (2026-08-03): integra proceduralmente urn:dev:artefacto:code-review
    mediante dos sesiones Fugaz read-only y aisladas, Standards y Spec, con punto
    fijo comun y join central sin fusion ni reranking entre ejes. v1.4.0 (2026-08-09):
    sustituye el checklist universal build-test-lint por cierre proporcional al riesgo
    y a la aceptacion observable; ABSENT no obliga a inventar tooling. v1.5.0 (2026-08-23):
    habilita el target Hermes tras realizar ley/3 v4.0.0 y T-hermes-pneuma-v2; el
    cuerpo completo se transporta al SOUL del perfil, las ramas exclusivas de Codex
    conservan su fallback explícito fuera de Codex y ship-discipline queda como dependencia
    desplegable separada, sin presentar componible como wiring probado. v1.6.0 (2026-08-23):
    eleva urn:dev:artefacto:ship-discipline desde candidato componible a dependencia
    requerida. Ley/3 v5.0.0 garantiza su disponibilidad como unidad y sello propios
    en cada target compatible; no presenta esa materialización como prueba de invocación
    ni composición. v1.7.0 (2026-09-01): alinea la colaboración con Fugaz 2.2.0; el
    núcleo deja de restringir la delegación a Codex, exige una realización específica
    del target que preserve paquete, aislamiento y cierre, y conserva los detalles
    Codex dentro de su adaptador situado; no declara wiring para ningún otro target."

