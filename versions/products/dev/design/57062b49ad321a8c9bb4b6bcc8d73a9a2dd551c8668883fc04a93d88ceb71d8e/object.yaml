    fuente: "Autorada nueva en KORA pneuma el 2026-06-22. Cristaliza, en formato skill
    ley/2, la esencia operativa del producto Claude Design de Anthropic Labs (research
    preview; anuncio 2026-04-17, overhaul 2026-06-17; fuentes anthropic.com/news/claude-design-anthropic-labs,
    support.claude.com get-started + set-up-design-system, venturebeat/thenewstack/techcrunch/engadget/techrepublic
    2026). Sucede CONCEPTUALMENTE a graphic-design (urn:kora:artefacto:graphic-design
    en la bestia ~/kora, sha256:fe261c35387ab98652f19d2e32b599921a930ac3583425eee973dea72c01cbd5):
    absorbe sus operadores visuales, los design tokens ejecutables (JSON+CSS+Tailwind),
    el SVG y el axioma info/simpleza, y los amplia a diseno generativo de UI/identidad/prototipos.
    NO se declara reemplaza ni refina: graphic-design no encarna en el censo pneuma
    (referencias-resuelven fallaria), de modo que la sucesion se formalizara recien
    al migrar el target. Vector [2,0,2,0,1] = disciplina (cuerpo de conocimiento procedural,
    sin materia propia): Pi2 plan ramificado (brief->system->generar->refinar->verificar->entregar),
    Mu0 el ejecutor provee todo el soporte (el canvas es materia del runtime anfitrion,
    no de la skill), Xi2 interaccion bidireccional (round-trip diseno<->codigo con
    Claude Code), Lambda0 individual, Phi1 instrumental. v1.1.0 (2026-06-23): refinamiento
    por consenso deliberativo (panel steve-jobs/steipete/agent-architect, modo orquestacion,
    1 ciclo de refutacion adversarial que cazo 2 criticas). Dos cruces resueltos sin
    promediar: (1) sustraccion — `verificar` ahora INVOCA (no copia) las preguntas
    letales del canon ya anclado como guardia binaria, y la regla 9 pasa de anclaje
    pasivo a anclaje-que-ejecuta (el axioma vinculante estaba muerto: import decorativo);
    (2) continuabilidad — `verificar` chequea ESTATICAMENTE (Read/Grep, mu=0-safe)
    que las referencias del artefacto resuelven, mientras el build EJECUTABLE se declara
    en HANDOFF.md como verificado-por-receptor (ejecutarlo dentro de la skill seria
    incoherencia cuerpo-vector mu=0). Ademas: bundle como contrato observable en `entregar`
    con gate de buen-formado pre-handoff, staging aislado, techo de iteracion (3 ciclos).
    La refutacion corrigio dos defectos antes de aplicar: no redefinir ''funcional''
    como ''continuable'' (regla 5 los separa: continuable=skill, funcional-runtime=receptor)
    y mover la validacion bundle/manifiesto de `verificar` a `entregar` (orden de
    estados). Vector [2,0,2,0,1] preservado: ninguna edicion ejecuta build. v1.2.0
    (2026-07-12): conserva Claude Design como procedencia del método pero vuelve el
    handoff agnóstico al agente receptor (Codex/Claude Code/OpenCode)."

