id: urn:salud:artefacto:hospitalizacion-domiciliaria
kind: skill
name: hospitalizacion-domiciliaria
description: 'Analiza y disena hospitalizacion domiciliaria a escala de programa y red: regimen,
  trayectoria, capacidad efectiva, respuesta, rescate, continuidad y fuentes aplicables, sin
  inferir equivalencia automatica con una cama hospitalaria.'
content: content.md
targets:
- codex
- hermes
resources: []
requires:
- urn:salud:kb:hodom-glosario-ontologia
- id: urn:salud:kb:hodom-reglamento-ds1-2022
  kind: knowledge
  condition: Una decisión en Chile depende del régimen sanitario nacional aplicable.
  purpose: Localizar el DS 1/2022 y verificar el texto primario vigente para el acto.
- id: urn:salud:kb:hodom-decreto-exento-31-2024
  kind: knowledge
  condition: El encargo chileno requiere la norma aprobada por el Decreto Exento 31/2024.
  purpose: Resolver ámbito, fecha y criterio sin atribuir requisitos no contenidos.
- id: urn:salud:kb:hodom-norma-tecnica-2024
  kind: knowledge
  condition: Se evalúa o diseña una exigencia técnica HODOM chilena.
  purpose: Aplicar sólo el apartado pertinente y verificar su vigencia.
- id: urn:salud:kb:hodom-direccion-tecnica
  kind: knowledge
  condition: La decisión trata responsabilidades de dirección técnica HODOM.
  purpose: Distinguir responsabilidad estable de autoridad para el acto concreto.
- id: urn:salud:kb:hsc-normativa-hodom-indice
  kind: knowledge
  condition: El asunto se sitúa en el Hospital de San Carlos.
  purpose: Navegar fuentes locales por clase sin promover aplicabilidad o práctica.
- id: urn:salud:artefacto:firs-razonamiento-sanitario
  condition: El encargo cruza decisiones individuales, de programa y de red.
  purpose: Conservar escala y límites inferenciales.
- id: urn:salud:kb:hodom-operacional-indicadores
  kind: knowledge
  condition: Se analizan resultados o capacidad histórica HSC.
  purpose: Usar el corte local como observación fechada, no como causa o meta universal.
- id: urn:salud:kb:hsc-pro-002-hospitalizacion-domiciliaria
  kind: knowledge
  condition: El índice vigente identifica esta fuente como aplicable al asunto HSC.
  purpose: Consultar el documento concreto sin promover automáticamente su autoridad.
- id: urn:salud:kb:hsc-pro-110-hodom-historico-2019
  kind: knowledge
  condition: Se investiga historia o contraste de práctica HODOM HSC.
  purpose: Conservar su carácter histórico.
