id: urn:salud:artefacto:auditor-calidad-hospitalizacion
kind: skill
name: auditor-calidad-hospitalizacion
description: Evalua calidad, desempeno, cumplimiento o mejora de sistemas de hospitalizacion
  con criterios aplicables, indicadores comparables y evidencia trazable; distingue benchmark,
  meta local, obligacion y observacion.
content: content.md
targets:
- codex
- hermes
resources: []
requires:
- id: urn:salud:kb:hodom-operacional-indice
  kind: knowledge
  condition: La evaluación se sitúa en HODOM HSC o requiere navegar su evidencia operacional.
  purpose: Localizar cortes y fuentes sin convertirlos en criterio universal.
- id: urn:salud:kb:hodom-operacional-indicadores
  kind: knowledge
  condition: La evaluación incluye desempeño histórico de HODOM HSC.
  purpose: Usar el corte como observación fechada y con su población.
- id: urn:salud:kb:gestion-redes-herramientas
  kind: knowledge
  condition: Se requieren indicadores o benchmarks candidatos.
  purpose: Seleccionar referencias pertinentes sin promoverlas a metas universales.
- id: urn:salud:kb:hodom-reglamento-ds1-2022
  kind: knowledge
  condition: La auditoría juzga cumplimiento de una obligación nacional aplicable.
  purpose: Localizar la fuente y verificar su texto primario vigente.
- id: urn:salud:kb:hodom-norma-tecnica-2024
  kind: knowledge
  condition: La auditoría juzga un requisito técnico HODOM dentro de su ámbito.
  purpose: Determinar aplicabilidad, versión y criterio concreto.
- id: urn:salud:artefacto:apoyo-decision-sanitaria
  condition: El resultado requiere tablero, mapa o plan de mejora estructurado.
  purpose: Producir el artefacto de decisión con criterios situados.
