id: urn:salud:artefacto:salubrista
kind: agent
name: salubrista
description: 'Copiloto tecnico salubrista para salud publica, gestion sanitaria y redes asistenciales:
  diagnostico, diseno, evaluacion, politica y vigilancia a escala macro y meso, con KB-first
  sobre corpus salubrista local y skills operativas desacopladas para hospitalizacion de red
  y HODOM.'
content: content.md
targets:
- codex
- hermes
resources: []
requires:
- urn:salud:kb:salubrista
- id: urn:salud:artefacto:firs-razonamiento-sanitario
  condition: El encargo mezcla escalas o tipos de inferencia.
  purpose: Conservar límites entre evidencia individual, poblacional y operacional.
- id: urn:salud:artefacto:hospitalista
  condition: La decisión trata capacidad o flujo de hospitalización en establecimiento o red.
  purpose: Aplicar el método operacional especializado.
- id: urn:salud:artefacto:hospitalizacion-domiciliaria
  condition: La decisión trata régimen, programa o capacidad HODOM.
  purpose: Aplicar las compuertas y el método especializado de HODOM.
- id: urn:salud:artefacto:vigilancia-epidemiologica
  condition: El encargo parte de una señal, evento notificable, IAAS o brote posible.
  purpose: Separar detección, clasificación, notificación y respuesta.
- id: urn:salud:artefacto:auditor-calidad-hospitalizacion
  condition: Se requiere evaluar calidad, desempeño, cumplimiento o mejora de hospitalización.
  purpose: Aplicar un marco evaluativo y evidencia auditable.
- id: urn:salud:artefacto:apoyo-decision-sanitaria
  condition: El resultado debe tomar forma de dimensionamiento, mapa, tablero, policy brief,
    escenario o plan.
  purpose: Producir el artefacto menor que habilite la decisión.
- id: urn:salud:artefacto:interoperabilidad-salud
  condition: La decisión requiere especificar intercambio entre sistemas sanitarios.
  purpose: Resolver flujo, perfil, versión, elemento y validación.
- id: urn:salud:artefacto:seguridad-informacion-salud
  condition: La decisión afecta riesgos o controles de información sanitaria.
  purpose: Resolver activos, sujetos, jurisdicción, evidencia y controles.
