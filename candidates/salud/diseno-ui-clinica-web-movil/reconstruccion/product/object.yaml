kind: skill
name: diseno-ui-clinica-web-movil
description: Diseña, implementa y evalúa la gráfica y estética funcional de TLHD-HEALTH
  y de interfaces clínicas comparables centradas en persona o episodio, exclusivamente
  para web responsive y mobile web, mediante una lente sintética Karri/Linear y Vercel.
  Usar al encuadrar, materializar o auditar esa UI; enrutar otros dominios o apps
  nativas a una capacidad general o específica. No atribuye participación ni aprobación
  a esas personas o equipos.
