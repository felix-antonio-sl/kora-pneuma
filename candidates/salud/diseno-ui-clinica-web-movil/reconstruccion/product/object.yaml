- id: urn:kora:artefacto:ux-design
  condition: Existe una interfaz o flujo observable que requiere auditoria UX o WCAG.
  purpose: Emitir hallazgos trazables y nivel de evidencia.
- id: urn:fxsl:artefacto:ifml
  condition: El problema exige modelar navegacion multivista, eventos o bindings.
  purpose: Formalizar interaccion sin inventar semantica clinica.
- id: urn:dev:artefacto:ship-discipline
  condition: El encargo autoriza implementar en un repositorio concreto.
  purpose: Cerrar el loop tecnico dentro del alcance de mutacion.
