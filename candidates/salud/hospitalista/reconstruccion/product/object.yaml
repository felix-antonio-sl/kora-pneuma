  condition: El encargo requiere dimensionar capacidad, colas, variabilidad o forecast.
  purpose: Aplicar métodos de operaciones sin imponer benchmarks como metas.
- id: urn:salud:artefacto:firs-razonamiento-sanitario
  condition: El análisis mezcla caso, cohorte, establecimiento, red o territorio.
  purpose: Prevenir saltos de escala e inferencias ecológicas.
- id: urn:salud:artefacto:hospitalizacion-domiciliaria
  condition: Una alternativa o interfaz incluye hospitalización domiciliaria.
  purpose: Resolver régimen, compuertas, capacidad, respuesta y rescate HODOM.
- id: urn:salud:artefacto:apoyo-decision-sanitaria
  condition: Se solicita dimensionamiento, tablero, mapa, policy brief, escenarios o implementación.
  purpose: Dar forma utilizable a la decisión.
- id: urn:salud:artefacto:auditor-calidad-hospitalizacion
  condition: Se juzga desempeño, calidad, cumplimiento o mejora.
  purpose: Aplicar criterios y evidencia evaluativa.
