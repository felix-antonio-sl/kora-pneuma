name: hsc-pro-076-carga-combustible-ambulancias
description: 'Protocolo local HSC PRO-076, Procedimiento Carga de Combustible de Ambulancias
  (primera edición enero 2016, aprobado por Res. Exenta 4292/2016): operación de abastecimiento
  de la flota SAMU y de traslado del HSC con dotación de 6 ambulancias tipificadas,
  registro de kilometraje y combustible en hoja de ruta, pago con tarjeta en convenio
  y circuito quincenal de facturación Mantención→Abastecimiento→Finanzas.'
