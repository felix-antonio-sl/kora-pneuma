    por DT: recorrido completo HODOM mediante batch_plan secuencial y stream, prueba
    de composicion SGH-Drive, ledger de proveniencia, presupuesto por paciente y embudo
    de candidatos en dos etapas que prohibe ejecutar por defecto los batch_plan masivos
    de los servicios. v2.2.0 (2026-07-30): liga la ejecución privada al perfil DEV_PERSONAL_FULL
