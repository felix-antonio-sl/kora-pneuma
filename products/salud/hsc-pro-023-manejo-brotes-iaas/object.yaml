name: hsc-pro-023-manejo-brotes-iaas
description: 'Protocolo local HSC PRO-023, Manejo de Brotes IAAS (cuarta edición agosto
  2022): estandariza detección, notificación (PCI, SICARS, SEREMI), estudio en 10
  pasos y cierre de brotes de infecciones asociadas a la atención de salud en servicios
  clínicos y unidades de apoyo del HSC; define brote prolongado (>28 días), reaparición
  (<3 meses) y repetición (>3 meses) con umbrales específicos para C. difficile, gastrointestinales
  pediátricos y COVID-19.'
