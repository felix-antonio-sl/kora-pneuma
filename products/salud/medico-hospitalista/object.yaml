    fuente: "Sublimado el 2026-06-12 desde la bestia artifacts/agents/salud/medico-hospitalista/AGENT.md
    v1.1.0 (sha256:6fe78dff285e18186ab6d3ec707800a5f378a9e04901aeb6ae567128ffc202dd);
    consolidacion salud (bump minor): agente micro-asistencial de paciente individual;
    los modos hospital/domicilio se ejercen via las skills componibles asistencial-hospital
    y asistencial-hodom sin duplicar su contenido en el cuerpo (deduplicacion declarada).
    v1.3.0 (2026-07-01): se realiza el target openclaw (ley/3 v1.3.0, T-openclaw-pneuma-v1);
    se anade a ''targets'' y se reforja el parrafo de voz del Proposito (adjetivos
    ''clinico/preciso/pragmatico'' → conducta observable: SOAP y separacion por fuente,
    razonar-desde-el-fracaso antes del alta, declarar el dato faltante; triada fin×estilo×registro
    + Tektonik C sobre B = seguridad del paciente y fidelidad clinica sobre parecer
    resolutivo, escalar ante la duda, decision final al humano), extrayendo la audiencia/estado
    fuera del span y delimitando la voz con el centinela kora:soul (ley/2 v1.4.0 §10
    r6). La reforja endurece la prudencia clinica; el cuerpo deja de ser byte-fiel
    en el parrafo de tono. Correccion 1.3.1 (2026-07-06): se reformula el compromiso
    de Sostenibilidad — ''no se almacenan datos de pacientes'' podia leerse como promesa
    de no-persistencia que el runtime openclaw contradice (memoria de workspace);
    ahora declara juicio caso-a-caso + gobernanza por memory-policy de la flota (HITL
    operador, deploy Fase A). v1.4.0 (2026-07-12): incorpora contrato minimo de autonomia
    para hsc-agent-cli v1.5.0 (agent-autonomy-1), permiso Bash, manual solo excepcional,
    punteros del envelope, hard stops y disciplina de censo/outage para consumo directo
    y delegacion. Correccion 1.4.1 (2026-07-13): elimina la promesa residual de no-persistencia
    que el agente no controla; fija no-reutilizacion entre pacientes y somete la persistencia
    automatica al gate de privacidad de la flota (informe de retroalimentacion 2026-07-13,
    K-04). v1.5.0 (2026-07-13): hace terminal el plan SOAP para decisiones terapeuticas
    y de disposicion, con indicacion, riesgos, monitorizacion, duracion, responsable,
    plazo y procedencia visible (informe de retroalimentacion 2026-07-13, K-03; canario
    sintetico de alta). v1.6.0 (2026-07-15): migra el consumo a hsc-agent-cli v3.0.0
    / beta-3 y agent-autonomy-2; adopta source_issues[], bundle_integrity y batch_plan.requests[],
    elimina dependencia de decision_safety, clinical_gaps y aliases recommended_*,
    y hace explícitos censo HODOM trivalente, no-precedencia SGH-Drive e identidad
    documental verificada por ingreso (hsc-agent-cli@804bb37). v1.7.0 (2026-07-17):
    fija hsc-agent-cli v3.1.0 / beta-3 y agent-autonomy-3; adopta empty_count, contexto
    parental canonico, presencia censal separada de direccionabilidad, batch_plan
    sin singleton, stream_contract y hard stop anti-PHI (hsc-agent-cli@3c541da). v1.8.0
    (2026-07-17): libera escritura, web, memoria buscable, mensajeria, sesiones, subagentes
    y elevado owner-only en OpenClaw; conserva Guardian auto para exec con allowlist
    exacta del CLI/rg y separa capacidad tecnica de autoridad clinica, privacidad
    y delegacion acotada. v1.9.0 (2026-07-18): adopta el release hsc-agent-cli v3.1.1/agent-autonomy-4
    y el build post-tag de1e0b7 con agent-autonomy-5 autorado en 2dabc8b; agrega S-HOSPITAL_UE_BOARDING
    como subestado micro-asistencial: SGH primario, DAU complementario, lote/singleton,
    stream fallido, salas no congeladas, delta sin persistencia deliberada y decision
    humana (hsc-agent-cli@2dabc8b). v1.10.0 (2026-07-29): adopta el perfil personal
    controlado y mono-usuario decidido por el operador; permite PII/PHI y acceso autonomo
    a recursos de informacion en las superficies autorizadas, elimina desidentificacion,
    /new y no-persistencia deliberada obligatorias, y conserva autoridad clinica,
    verificacion de identidad, no-invencion, proteccion de credenciales y control
    explicito de mutaciones destructivas/control-plane. v1.12.0 (2026-08-09): adopta
    el corte hsc-agent-cli v3.2.0/agent-autonomy-6 y separa salud del núcleo, completitud
    de capacidades y calidad de Drive sin ampliar autoridad clínica."

