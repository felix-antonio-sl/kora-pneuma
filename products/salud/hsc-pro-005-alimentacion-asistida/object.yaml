name: hsc-pro-005-alimentacion-asistida
description: 'Protocolo local HSC PRO-005, Alimentación Asistida (tercera edición
  agosto 2019): incorpora al familiar/cuidador responsable a la asistencia de la alimentación
  del paciente dependiente —vía oral, SNG/nasoyeyunal, gastrostomía— con técnica paso
  a paso y educación formal, declarando como objetivo explícito el entrenamiento para
  la continuidad de los cuidados de alimentación posteriores al alta.'
