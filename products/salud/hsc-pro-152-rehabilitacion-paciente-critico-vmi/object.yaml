name: hsc-pro-152-rehabilitacion-paciente-critico-vmi
description: 'Protocolo local HSC PRO-152, Rehabilitación del Paciente Crítico Adulto
  Usuario de VMI (primera edición agosto 2020, Res. Exenta 3715): proceso continuo
  kine-fonoaudiológico desde UPC hasta alta hospitalaria — evaluación inicial con
  Barthel/Rankin/APACHE II, pauta diaria de seguridad para movilización con contraindicaciones
  absolutas y relativas, fases Gossetink, manejo de disfagia post-extubación (GUSS-ICU/FILS)
  y derivación a rehabilitación ambulatoria del 100% de los usuarios de VMI.'
