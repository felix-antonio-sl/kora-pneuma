kind: knowledge
name: hodom-invariante-no-equivale-cerrada
description: 'Invariante de dominio HODOM: la hospitalizacion domiciliaria no equivale
  a la cerrada; la diferencia esencial es la capacidad de vigilancia/rescate y su
  latencia, lo que restringe su dominio a pacientes seleccionados por bajo riesgo,
  con reversibilidad obligatoria.'
