name: hsc-pro-160-teletrombolisis
description: 'Protocolo local HSC PRO-160, Tele Trombolisis en pacientes mayores de
  18 años con ACV isquémico (primera edición mayo 2021): acceso precoz al diagnóstico
  y trombolisis endovenosa guiada por videoconferencia con residente de Neurología
  del HCHM para pacientes en ventana <4,5 hrs que ingresan a Emergencia HSC; reduce
  brecha geográfica de Ñuble y coordina red para trombectomía mecánica (HCRGB) y UCI
  según complejidad.'
