description: 'Protocolo local HSC PRO-085, Atención Farmacéutica del Programa de Anticoagulantes
  Orales (segunda edición noviembre 2022, vigencia hasta noviembre 2025): programa
  de atención farmacéutica sobre el policlínico TACO (~650 pacientes) con seguimiento
  farmacoterapéutico método Dáder, criterios de inclusión por INR fuera de rango/adherencia/ERC,
  test Morisky-Green, conciliación farmacéutica, PRM e indicadores semestrales de
  desempeño.'
