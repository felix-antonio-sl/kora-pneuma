name: hsc-pro-187-telediabetes
description: 'Protocolo local HSC PRO 187, Atención Telediabetes (primera edición
  abril 2024, vigencia hasta abril 2029): teleconsulta sincrónica/asincrónica de diabetes
  tipo 2 vía UNITEL y Teleprocesos para primera consulta o ajuste de esquemas de insulina/fármacos
  de nueva generación, con requerimientos previos (HbA1c y exámenes 3 meses, fondo
  de ojo, adherencia a insulina), facilitador en domicilio del paciente y egreso por
  causal 17 atendido por telemedicina.'
