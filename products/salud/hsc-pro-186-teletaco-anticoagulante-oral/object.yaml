name: hsc-pro-186-teletaco-anticoagulante-oral
description: 'Protocolo local HSC PRO 186, Atención Teletratamiento Anticoagulante
  Oral TACO (primera edición marzo 2024, vigencia hasta marzo 2029): teleconsulta
  sincrónica/asincrónica de anticoagulación vía UNITEL y plataforma de Teleprocesos
  para TEP/TVP, FA, prótesis valvulares y post-IAM, con requisitos previos (laboratorio
  INR, CHA2DS2-VASc, HAS-BLED), facilitador en CESFAM o domicilio del paciente y traspaso
  al policlínico TACO.'
