description: 'Protocolo local HSC PRO-103, Programa de Acompañamiento Psicosocial
  Ley 21.030/IVE (tercera edición mayo 2024, vigencia hasta mayo 2029): lineamientos
  del equipo psicosocial para acoger, informar, contener y acompañar a adolescentes
  y mujeres en las tres causales de interrupción voluntaria del embarazo, con apoyo
  psicoterapéutico, detección de vulnerabilidad y articulación intersectorial; alcance
  UE obstetricia, servicio Obstetricia, Policlínico SAIO y S.A. Psicosocial.'
