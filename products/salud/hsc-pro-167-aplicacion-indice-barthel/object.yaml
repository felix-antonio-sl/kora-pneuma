name: hsc-pro-167-aplicacion-indice-barthel
description: 'Protocolo local HSC PRO-167, Aplicación del Índice de Barthel (primera
  edición, noviembre 2022, vigencia declarada hasta noviembre 2027): instrumento institucional
  de medición de dependencia en ABVD para personas mayores de 65 años al ingreso y
  egreso hospitalario, con responsables por estamento, circuito de registro en ficha
  clínica, traspaso a APS vía CAE e indicador trimestral de cumplimiento.'
