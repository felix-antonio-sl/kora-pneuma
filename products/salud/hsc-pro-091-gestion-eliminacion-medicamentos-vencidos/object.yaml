name: hsc-pro-091-gestion-eliminacion-medicamentos-vencidos
description: 'Protocolo local HSC PRO-091, Gestión y Eliminación de Medicamentos e
  Insumos Vencidos y/o Deteriorados (quinta edición marzo 2022, Res. Exenta 1365/2022):
  monitorización del vencimiento (CAF mensual, informe pronto-vencer 6 meses), regla
  de recepción sin fármacos a menos de 12 meses, baja por ajuste de merma en SIGBO,
  comisión ministros de fe, acta y resolución exenta semestral, segregación REAS en
  bolsa clase 6/9 y declaración SIDREP.'
