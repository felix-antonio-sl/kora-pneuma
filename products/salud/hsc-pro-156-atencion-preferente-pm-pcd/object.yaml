name: hsc-pro-156-atencion-preferente-pm-pcd
description: 'Protocolo local HSC PRO-156, Atención Preferente de Personas Mayores
  y Personas con Discapacidad (primera edición febrero 2021): operativiza en HSC la
  Ley 21.168/Ley 20.584 — acreditación (cédula ≥60 años, credencial/certificado RND
  o COMPIN ≤60 días), prioridad en Emergencia dentro de categorización ESI, ventanillas
  preferentes DGU/Farmacia, bloques 08:00-10:00 para exámenes y mínimo 5% de oferta
  de consultas y procedimientos para PM/PCD.'
