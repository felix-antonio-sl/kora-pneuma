name: hsc-pro-170-plan-anual-prevencion-control-infecciones
description: 'Protocolo local HSC PRO-170, Plan Anual de Prevención y Control de Infecciones
  año 2023 (tercera edición marzo 2023): programa obligatorio institucional del Equipo
  Control de Infecciones con 9 actividades verificables — vigilancia cuatrimestral
  IAAS en SICARS, estudio de prevalencia, análisis de brotes y resistencia antimicrobiana
  (ARAISP), planes de mejora para IAAS sobre tasa nacional, auditoría EPP, capacitación
  de supervisores y funcionarios — con indicadores y umbral 100% (capacitación 90%/80%).'
