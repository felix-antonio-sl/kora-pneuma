name: hsc-pro-043-ingreso-de-usuarios
description: 'Protocolo local HSC PRO-043, Ingreso de Usuarios/as (tercera edición
  agosto 2019): proceso institucional de ingreso a atención cerrada y ambulatoria
  — vías de ingreso (CAE, gestión quirúrgica, teleprocesos, urgencia, re-hospitalización),
  orden de hospitalización escrita, asignación de camas UGCC hábil/enfermería fuera
  de hora, registro DGU y egreso con epicrisis y devolución de ficha en 72 horas.'
