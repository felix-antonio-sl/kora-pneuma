name: hsc-pro-053-hospitalizacion-desde-unidad-emergencia
description: 'Protocolo local HSC PRO-053, Procedimiento de Hospitalización desde
  Unidad de Emergencia (primera edición octubre 2013, aprobado por Res. Exenta 0378
  del 19-02-2014, vigencia impresa hasta octubre 2016): compuerta operativa UE→cama
  con orden escrita en DAU, formulario de ingreso médico, recetón 24 horas, asignación
  UGCC en horario hábil y por enfermería fuera de hora, valoración inicial, categorización
  de riesgo y hoja de ruta con tiempos.'
