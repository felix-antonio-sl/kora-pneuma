name: information-system-usage-theory-alter
description: 'Information System Usage Theory (ISUT) de Steven Alter: teoría de sistemas
  y ontológica que redefine el uso de sistemas de información como la aplicación,
  por un work system, de los product/services producidos por un IS; incluye tres axiomas,
  doce supuestos, condiciones de frontera y un marco de roles de agentes y facetas
  del trabajo para sistemas sociotécnicos y totalmente automatizados.'
