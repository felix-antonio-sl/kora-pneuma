name: work-system-theory-alter
description: 'Work System Theory (WST) de Steven Alter: el work system como unidad
  natural de análisis de los sistemas en organizaciones. Cubre la definición de work
  system, el information system como caso especial (IS↔WS), el work system framework
  (9 elementos), el work system life cycle (WSLC), el work system method (WSM), las
  11 funciones que un IS presta a un work system, las formas de overlap IS↔WS, y las
  extensiones (principles, design spaces, metamodel, facets, axioms).'
