  legacy_header: '---

    urn: urn:fxsl:artefacto:memorizacion-espaciada

    nombre: memorizacion-espaciada

    version: 1.0.0

    estado: activo

    descripcion: "Skill para conducir un loop sostenible de memorizacion por repeticion espaciada
    (Anki/FSRS): capturar semillas en caliente, triar en frio (borrar es resultado valido),
    formular tarjetas atomicas con las palabras del operador mientras la IA audita contra las
    reglas de Wozniak, repasar anclado con valvula de desborde para el dia malo, y revisar con
    evals de transferencia. El norte no es retencion ni streak: es soltar lo aprendido y confiar
    en que el sistema lo sostiene, sin culpa."

    fuente: "Autorada en pneuma el 2026-06-21 desde la sintesis de un panel de tres: steipete
    (adoptar no construir: usar Anki/FSRS, add-ons minimos, sin heatmap de vanidad); allan-kelly
    (formular=aprender, la IA audita pero el humano escribe; evals de transferencia por un agente
    distinto del auditor; desired retention 0.90; el cuello es la atencion, no la generacion);
    david-allen (captura != formulacion, valvula del dia malo, ''1 ancla + 2 de oportunidad'',
    sostenibilidad sin culpa como norte). Reglas de formulacion condensadas de las 20 reglas
    de Piotr Wozniak (SuperMemo). El documento humano de habilitacion (instalacion Anki/FSRS,
    checklist) vive en el cuaderno del operador ~/projects/formacion-continua/00-rol/."

    autor: FS

    creado: 2026-06-21

    lang: es

