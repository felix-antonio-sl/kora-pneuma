id: urn:fxsl:kb:langacker-cg-estructuras
kind: knowledge
name: langacker-cg-estructuras
description: 'Estructuras gramaticales en Cognitive Grammar (Parte III, caps. 9-12):
  grounding (construal subjetivo/objetivo, type vs. instance, grounding nominal y
  clausal), estructura nominal (modificadores, clasificación, cuantificación, flexión,
  concordancia), estructura clausal (organización global, sujeto y objeto —definiciones
  esquemáticas—, tipos de cláusula, verbos complejos), y oraciones complejas (coordinación/subordinación
  multidimensional, conexiones clausales —adverbiales, relativas, complementos—, complementos
  finitos y control).'
