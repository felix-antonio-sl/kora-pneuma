id: urn:fxsl:kb:langacker-cg-fronteras
kind: knowledge
name: langacker-cg-fronteras
description: 'Fronteras de Cognitive Grammar (Parte IV, caps. 13-14): discurso como
  base de la estructura lingüística (sustrato conceptual, géneros discursivos, construcción
  de estructura discursiva, anclaje encubierto —covert grounding—); dinamicidad de
  la conceptualización (caminos de acceso mental, punto de referencia, posesión, anáfora
  pronominal, tópico vs. sujeto); fictividad (entidades virtuales, movimiento ficticio,
  cambio ficticio, habla ficticia); y simulación/subjetificación como anclaje de la
  mente en la experiencia corporeizada.'
