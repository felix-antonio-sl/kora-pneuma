[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtd-felix"
version = "0.1.0"
description = "Registro GTD persistente y adaptadores para Félix"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gtd_felix*"]
