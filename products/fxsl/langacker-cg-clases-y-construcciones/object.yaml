id: urn:fxsl:kb:langacker-cg-clases-y-construcciones
kind: knowledge
name: langacker-cg-clases-y-construcciones
description: 'Clases gramaticales y construcciones en Cognitive Grammar (Parte II,
  caps. 4-8): caracterización semántica de nombre, verbo, y clases de expresiones
  relacionales (preposición, adjetivo, adverbio, participio); subclases mayores (count/mass,
  perfective/imperfective); la teoría construccional — assemblies simbólicos, esquemas
  construccionales, correspondencias, profile determinance, elaboración, constituencia—;
  redes, convencionalidad y regularidad (generalidad, productividad, composicionalidad
  parcial, generalizaciones de orden superior).'
