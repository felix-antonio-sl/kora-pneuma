name: steve-jobs-principios-salud
description: 'Extension del canon de diseno de Steve Jobs a la superficie de los sistemas
  institucionales de salud (EHR/HIS/LIS, flujos clinicos, alertas, portales de paciente):
  el residente agotado de las 2 AM como benchmark, la estetica como herramienta cognitiva
  en alto riesgo, offline como caso base, y los principios INTEGROS de seguridad del
  paciente (ganar el derecho a interrumpir, el error silencioso, dignidad en cada
  pixel, la clinica gana sobre el diseno). Especializa el canon; aqui solo el delta
  de superficie.'
