name: steve-jobs-principios-web-ai
description: 'Extension del canon de diseno de Steve Jobs a la superficie de apps
  web con AI features integradas (copilots, chat, autocomplete, generacion): velocidad
  percibida, latency budget honesto, copilot como co-piloto no co-conductor, generacion
  trazable/reversible/atribuible, estado del sistema siempre visible, y los anti-patrones
  de la era agentica. Especializa el canon; aqui solo el delta de superficie.'
