id: urn:dev:artefacto:test-vivo-iterativo-opmkv
kind: skill
name: test-vivo-iterativo-opmkv
description: 'Skill para auditoria in-vivo iterativa del modelador OPM (deep-opm-pro): conduce un navegador
  headless contra el dev server, ejecuta una bateria de criterios visuales/UX/funcionales contra el DOM,
  captura screenshots y errores de runtime, refina iterativamente cuando un FAIL/WARN viene de la sonda,
  y emite un reporte ejecutivo que siempre reemplaza al previo. Para usar cuando el operador pide validar
  in-vivo el modelador, regenerar el reporte tras un cambio o cerrar un loop con evidencia visual antes
  de commitear.'
