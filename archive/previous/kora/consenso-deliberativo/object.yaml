id: urn:kora:artefacto:consenso-deliberativo
kind: skill
name: consenso-deliberativo
description: 'Skill horizontal para resolver un problema mediante consenso critico
  entre N expertos (recomendado 3), donde cada experto es una identidad encarnable
  (agente, persona, skill de razonamiento) mas sus capacidades. Protocolo: propuestas
  iniciales independientes, criticas cruzadas sustantivas, sintesis comun, refutacion
  adversarial, ciclos de correccion hasta convergencia o disenso estructurado. Anti-degeneracion:
  prohibido el consenso de cortesia, el disenso irreductible es salida valida, la
  confianza se declara por experto sin promediar.'
