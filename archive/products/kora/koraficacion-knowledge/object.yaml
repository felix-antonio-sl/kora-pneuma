    \      salida: \"artefacto KORA/MD borrador, reporte FS/CR, evidencia de auditoria y deuda residual\"\
    \n  invariantes:\n    reglas_duras:\n      - \"La salida es Markdown KORA/MD; no emitir YAML KODA\
